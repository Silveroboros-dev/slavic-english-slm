name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Lint Python for correctness errors
        run: |
          python -m pip install ruff==0.14.6
          ruff check --no-cache --select E9,F63,F7,F82 pipeline tests training
      - name: Check the dashboard against its source data
        run: python pipeline/build_norm64_dashboard.py --check
      - name: Run tests, including both README dashboard links
        run: python -m unittest discover -s tests -v
